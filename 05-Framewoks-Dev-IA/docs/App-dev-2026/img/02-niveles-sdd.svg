<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Espectro de compromiso con la spec</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Niveles 2–4: taxonomía de Birgitta Böckeler (Thoughtworks). Niveles 0–1: extensión práctica para ubicar frameworks ligeros.</text>

  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="0.5" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="40" y="90" width="880" height="70" rx="12" fill="url(#g)" stroke="#d1d5db"/>
  <line x1="60" y1="175" x2="900" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="60" y="198" font-size="12" fill="#374151">la conversación es la fuente de verdad</text>
  <text x="900" y="198" text-anchor="end" font-size="12" fill="#374151">la spec es la fuente de verdad</text>

  <!-- levels -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">
    <text x="128" y="122">0 · Vibe</text>
    <text x="304" y="122">1 · Plan-first</text>
    <text x="480" y="122">2 · Spec-first</text>
    <text x="656" y="122">3 · Spec-anchored</text>
    <text x="832" y="122">4 · Spec-as-source</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4b5563">
    <text x="128" y="142">prompt → código</text>
    <text x="304" y="142">plan efímero por tarea</text>
    <text x="480" y="142">spec antes, luego se congela</text>
    <text x="656" y="142">spec viva, se actualiza</text>
    <text x="832" y="142">solo se edita la spec</text>
  </g>
  <g stroke="#9ca3af">
    <line x1="216" y1="95" x2="216" y2="155"/>
    <line x1="392" y1="95" x2="392" y2="155"/>
    <line x1="568" y1="95" x2="568" y2="155"/>
    <line x1="744" y1="95" x2="744" y2="155"/>
  </g>

  <!-- frameworks placed -->
  <g font-size="13">
    <rect x="240" y="225" width="130" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="305" y="247" text-anchor="middle" fill="#312e81">RPI / QRSPI</text>

    <rect x="240" y="270" width="130" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="305" y="292" text-anchor="middle" fill="#312e81">Superpowers</text>

    <rect x="300" y="315" width="170" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="385" y="337" text-anchor="middle" fill="#312e81">Compound Eng. (+memoria)</text>

    <rect x="410" y="225" width="140" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="480" y="247" text-anchor="middle" fill="#312e81">Spec Kit</text>

    <rect x="410" y="270" width="140" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="480" y="292" text-anchor="middle" fill="#312e81">GSD Core</text>

    <rect x="485" y="360" width="170" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="570" y="382" text-anchor="middle" fill="#312e81">BMAD (árbol de tickets)</text>

    <rect x="485" y="405" width="170" height="34" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="570" y="427" text-anchor="middle" fill="#312e81">AI-DLC (docs en repo)</text>

    <rect x="590" y="225" width="135" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="657" y="247" text-anchor="middle" fill="#14532d">OpenSpec</text>

    <rect x="620" y="315" width="210" height="34" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="725" y="337" text-anchor="middle" fill="#78350f">Ralph (specs fijas + tests)</text>

    <rect x="770" y="225" width="125" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="832" y="247" text-anchor="middle" fill="#4b5563">Tessl (aspiración)</text>
  </g>

  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#6b7280">Las posiciones son aproximadas: varios frameworks se mueven entre niveles según cómo los uses (p. ej. Spec Kit + /converge, BMAD con tickets persistentes).</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#6b7280">Böckeler (2025): "no estoy segura de que alguna herramienta actual implemente spec-as-source".</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
