<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Mapa de los 7 frameworks: ceremonia vs alcance</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Tamaño del círculo ≈ autonomía del agente sin supervisión · posiciones cualitativas</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- quadrants -->
  <rect x="100" y="90" width="370" height="230" fill="#f0f9ff"/>
  <rect x="470" y="90" width="370" height="230" fill="#fdf4ff"/>
  <rect x="100" y="320" width="370" height="230" fill="#f0fdf4"/>
  <rect x="470" y="320" width="370" height="230" fill="#fffbeb"/>
  <text x="115" y="110" font-size="12" fill="#0369a1">Equipo/org · poca ceremonia</text>
  <text x="825" y="110" text-anchor="end" font-size="12" fill="#a21caf">Equipo/org · mucha ceremonia</text>
  <text x="115" y="540" font-size="12" fill="#15803d">Individuo · poca ceremonia</text>
  <text x="825" y="540" text-anchor="end" font-size="12" fill="#b45309">Individuo · mucha ceremonia</text>

  <!-- axes -->
  <line x1="100" y1="550" x2="850" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="100" y1="550" x2="100" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="585" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Ceremonia / artefactos (baja → alta)</text>
  <text x="50" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" transform="rotate(-90 50 320)">Alcance (dev solo → organización)</text>

  <!-- points -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <circle cx="200" cy="470" r="20" fill="#6366f1" opacity="0.85"/>
    <text x="200" y="508" fill="#312e81">RPI / QRSPI</text>

    <circle cx="170" cy="400" r="40" fill="#f59e0b" opacity="0.8"/>
    <text x="170" y="405" fill="#ffffff">Ralph</text>

    <circle cx="330" cy="455" r="22" fill="#10b981" opacity="0.85"/>
    <text x="330" y="494" fill="#065f46">Superpowers</text>

    <circle cx="460" cy="420" r="28" fill="#0ea5e9" opacity="0.85"/>
    <text x="460" y="465" fill="#075985">GSD Core</text>

    <circle cx="320" cy="300" r="22" fill="#22c55e" opacity="0.85"/>
    <text x="320" y="338" fill="#14532d">OpenSpec</text>

    <circle cx="470" cy="270" r="26" fill="#14b8a6" opacity="0.85"/>
    <text x="470" y="310" fill="#115e59">Compound Eng.</text>

    <circle cx="600" cy="230" r="22" fill="#8b5cf6" opacity="0.85"/>
    <text x="600" y="268" fill="#4c1d95">Spec Kit</text>

    <circle cx="700" cy="330" r="26" fill="#ec4899" opacity="0.85"/>
    <text x="700" y="372" fill="#831843">BMAD</text>

    <circle cx="760" cy="140" r="20" fill="#ef4444" opacity="0.85"/>
    <text x="760" y="178" fill="#7f1d1d">AI-DLC</text>
  </g>

  <text x="450" y="615" text-anchor="middle" font-size="12" fill="#6b7280">BMAD y GSD escalan su ceremonia según el tamaño de la tarea; Ralph es el de mayor autonomía (y mayor riesgo).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
