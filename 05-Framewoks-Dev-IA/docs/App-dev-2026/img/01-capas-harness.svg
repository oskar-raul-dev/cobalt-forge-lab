<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="860" height="600" fill="#ffffff"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Anatomía de un agente de código: modelo + arnés (harness)</text>
  <text x="430" y="64" text-anchor="middle" font-size="14" fill="#6b7280">Lo estándar (AAIF / abierto) en azul · lo específico de cada producto en naranja</text>

  <!-- Hooks / permisos (outer) -->
  <rect x="40" y="90" width="780" height="470" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="bold" fill="#9a3412">5 · Barandas duras: hooks, permisos, sandbox</text>
  <text x="60" y="138" font-size="12" fill="#9a3412">Lo que AGENTS.md pide, un hook lo obliga (bloquear comandos, formatear, correr tests)</text>

  <!-- Runtime -->
  <rect x="70" y="155" width="720" height="385" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="90" y="182" font-size="15" font-weight="bold" fill="#374151">Runtime del agente (Claude Code, Codex, Gemini CLI, Cursor, Copilot, OpenCode…)</text>
  <text x="90" y="200" font-size="12" fill="#4b5563">El "sistema operativo": loop de herramientas, gestión de contexto, compactación</text>

  <!-- Model -->
  <rect x="330" y="225" width="200" height="80" rx="12" fill="#1f2937"/>
  <text x="430" y="260" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Modelo (LLM)</text>
  <text x="430" y="282" text-anchor="middle" font-size="12" fill="#d1d5db">el "procesador"</text>

  <!-- Four blocks -->
  <rect x="95" y="330" width="160" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1 · AGENTS.md</text>
  <text x="175" y="380" text-anchor="middle" font-size="12" fill="#1e3a8a">Reglas fijas</text>
  <text x="175" y="397" text-anchor="middle" font-size="12" fill="#1e3a8a">del repo</text>
  <text x="175" y="422" text-anchor="middle" font-size="11" fill="#2563eb">siempre en contexto</text>

  <rect x="270" y="330" width="160" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">2 · Skills</text>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#1e3a8a">Saber cómo hacer</text>
  <text x="350" y="397" text-anchor="middle" font-size="12" fill="#1e3a8a">una tarea (SKILL.md)</text>
  <text x="350" y="422" text-anchor="middle" font-size="11" fill="#2563eb">carga bajo demanda</text>

  <rect x="445" y="330" width="160" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="525" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">3 · MCP</text>
  <text x="525" y="380" text-anchor="middle" font-size="12" fill="#1e3a8a">Acceso a sistemas</text>
  <text x="525" y="397" text-anchor="middle" font-size="12" fill="#1e3a8a">externos (tools)</text>
  <text x="525" y="422" text-anchor="middle" font-size="11" fill="#2563eb">ocupa contexto fijo</text>

  <rect x="620" y="330" width="150" height="110" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="695" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">4 · Subagentes</text>
  <text x="695" y="380" text-anchor="middle" font-size="12" fill="#9a3412">Delegar en</text>
  <text x="695" y="397" text-anchor="middle" font-size="12" fill="#9a3412">contexto aislado</text>
  <text x="695" y="422" text-anchor="middle" font-size="11" fill="#c2410c">formato por producto</text>

  <!-- arrows -->
  <line x1="175" y1="330" x2="380" y2="305" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="350" y1="330" x2="410" y2="305" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="525" y1="330" x2="460" y2="305" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="695" y1="330" x2="490" y2="305" stroke="#6b7280" stroke-width="1.5"/>

  <rect x="95" y="460" width="675" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="432" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Encima: metodologías / frameworks (SDD, BMAD, AI-DLC, RPI, Ralph, Superpowers…)</text>
  <text x="432" y="505" text-anchor="middle" font-size="12" fill="#065f46">se implementan como combinaciones de estas piezas: reglas + skills + comandos + artefactos .md en el repo</text>

  <text x="430" y="585" text-anchor="middle" font-size="12" fill="#6b7280">"Un modelo decente con un gran arnés le gana a un gran modelo con un mal arnés." — idea central de la harness engineering</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
